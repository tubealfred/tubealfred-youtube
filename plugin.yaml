manifest_version: 1
name: tubealfred-youtube
version: "0.1.4"
description: Read-only TubeAlfred YouTube API tools plus billing usage lookup for Hermes agents.
author: TubeAlfred
requires_env:
  - name: TUBEALFRED_API_KEY
    description: TubeAlfred API key. Use youtube.read for YouTube tools and billing.read for billing usage.
    url: https://tubealfred.com/app/api-keys
    secret: true
provides_tools:
  - tubealfred_billing_usage
